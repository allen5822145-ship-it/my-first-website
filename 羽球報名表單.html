<html>
 <head>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>羽球臨打報名表</title>	
	<style>
		body {
			margin: 0;
			padding: 0;
			background-image: url('imgs/背景.jpg');
			background-repeat: no-repeat;
			background-size: 100%;
			font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
			color: #4a3728;
			display: flex;
			flex-direction: column;
			align-items: center;
			min-height: 100vh;
			cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' style='font-size:32px;'><text y='32'>🏸</text></svg>") 16 16, auto;
		}

		h1 {
			font-size: 2.5rem;
			color: #d17a3a;
			margin-bottom: 10px;
		}
			
		select {
			width: 5cm;            /* 直接指定寬度 */
			padding: 10px 15px;     /* 上下內邊距加大 */
			font-size: 18px;        /* 字體加大 */
			border-radius: 6px;
			margin-bottom: 15px;    /* 推開下方的按鈕 */
		}
			
		fieldset {
			width: 10cm;
			margin-bottom: 15px; /* 推開下方的按鈕 */
			box-sizing: border-box; /* 確保寬度計算包含邊框 */
			padding: 10px;
		}
			
		/* 讓 fieldset 裡面的段落文字都變成白色 */
		fieldset p {
			color: white; /* 或者使用亮色如 #ffffff */
			font-weight: bold; /* 加粗會更清晰 */
		}
			
		/* 🎯 修改 legend 的各項 CSS 參數 */
		legend {
			font-size: 1.1rem;         /* 1. 字體大小 */
			font-weight: bold;         /* 2. 標題加粗 */
			color: #d17a3a;            /* 3. 文字顏色 */
			padding: 2px 10px;         /* 4. 左右留白（避免壓到外框線） */
			background-color: white;   /* 5. 背景設為白色 */
			border: 1px solid #d17a3a; /* 6. 給標題加獨立小框 */
			border-radius: 12px;       /* 7. 標題獨立圓角 */
			text-align: center;   /* 若需要居中，部分瀏覽器可搭配 margin 設定 */
		}	

		fieldset select {
			width: 100%;            /* 讓下拉選單跟著 fieldset 一起拉寬 */
			padding: 3px;
			font-size: 16px;
		}

		/* 修正 1：移除衝突的 width: 4cm 與 font-size: 12px，只保留游標 */
		button, .btn, a {
			cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' style='font-size:32px;'><text y='32'>👆</text></svg>") 16 16, auto;
		}

		.btn-group {
			display: flex;
			flex-direction: row;
			justify-content: center;
			gap: 12px;
			margin-top: 10px;
		}

		.btn {
			background-color: #e58e4f;
			color: white;
			border: none;
			padding: 10px 24px;
			font-size: 1.1rem;
			border-radius: 50px;
			font-weight: bold;
			transition: all 0.2s ease;
			box-shadow: 0 4px 10px rgba(229, 142, 79, 0.3);
		}

		.btn:hover {
			background-color: #d17a3a;
			transform: scale(1.05);
		}

		.btn-secondary {
			background-color: #a8cd89;
			box-shadow: 0 4px 10px rgba(168, 205, 137, 0.3);
		}

		.btn-secondary:hover {
			background-color: #8fb86e;
		}	
		
		/* 修正 2：改用 input[type="text"]，避免影響到單選框與複選框 */
		input[type="text"] {
			font-size: 0.9rem;
			border: none;
			background-color: #d47b3b;
			color: #ffffff; /* 改回白色文字更清晰 */
			padding: 6px 12px;
			border-radius: 50px;
			font-weight: bold;
			transition: all 0.2s ease;
			box-shadow: 0 4px 10px rgba(212, 123, 59, 0.3);
			font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
			outline: none;
		}
	</style>		
  </head>

  <body>
    <h1>羽球臨打報名表</h1> 
	<form method="post" action="">
		<select name="book" size=1>
			<option value="book1" selected>請選擇自己等級</option>
			<option value="book2">1~3級--歡樂場</option>
			<option value="book3">4~5級--初階場</option>
			<option value="book4">6~7級--中下場</option>
			<option value="book5">8~9級--中階場</option>
			<option value="book6">10級~12級--中上場</option>
			<option value="book7">13↑--國手級</option>
		</select>
	</form>
	  
	<fieldset style='width:500px'>
		<legend>輸入基本資料</legend>
		<p>姓名/綽號: <input name="f1" type="text" id="f1"></p>
		
		<p>性別:
			<input name="f2" type="radio" value="M">男
			<input name="f2" type="radio" value="F">女
		</p>
		
		<p>可接受球種:
			<input name="f3" type="checkbox" value="RSL">RSL3/4
			<input name="f3" type="checkbox" value="VIC">勝利藍蓋
			<input name="f3" type="checkbox" value="VOL">VOLAR30
			<input name="f3" type="checkbox" value="750">超力X750
		</p>
		
		<p>報名時間: 
			<input name="f5" type="checkbox" value="912" class="signup-time">早上9點~12點
			<input name="f5" type="checkbox" value="711" class="signup-time">晚上7點~10點
		</p>
		<div id="notice" style="color: #e63946; font-size: 0.85em; display: none; margin-top: 5px;">⚠️ 您已報名兩場！
		</div>
		
		<script>
    // 取得所有 class 為 signup-time 的 checkbox
			const checkboxes = document.querySelectorAll('.signup-time');
			const notice = document.getElementById('notice');

    // 監聽每一個 checkbox 的變更事件
			checkboxes.forEach(checkbox => {
			checkbox.addEventListener('change', () => {
            // 計算目前有幾個被勾選
            const checkedCount = document.querySelectorAll('.signup-time:checked').length;
            
            // 如果勾選數量等於 2，就顯示提醒，否則隱藏
            if (checkedCount === 2) {
                notice.style.display = 'block';
            } else {
                notice.style.display = 'none';
					}
				});
			});
</script>
		
		
		
		<p>居住地區:
			<select name="f4" size="1">
				<option value="f41" selected>請選擇</option>
				<option value="f42">北區</option>
				<option value="f42">東區</option>
				<option value="f42">竹北</option>
			</select>
		</p>
		
		<p><span style="color: red; font-weight: bold; background-color: white;">注意事項:</span>團主會依照個人能力安排對打，有時會須打混雙</p>
		
	</fieldset>
	
	<div class="btn-group">
		<button class="btn">送出</button>
		<button class="btn btn-secondary">清除</button>
	</div>
  </body>
</html>
